<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f7f7f2">
  <meta name="htmx-config" content='{"defaultSettleDelay":0}'>
  <title>Causal coding · Research workbench</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', path='/causal-signal.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='/workbench.css') }}">
  <script src="{{ url_for('static', path='/vendor/htmx.min.js') }}" defer></script>
  <script src="{{ url_for('static', path='/sketch.js') }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#inspector">Skip to details</a>
  {% block body %}{% endblock %}
  <div id="request-error" class="request-error" role="alert" hidden>That view could not be loaded. Your current view is unchanged. <button type="button" data-dismiss-error>Dismiss</button></div>
  <noscript><p class="noscript">Enable JavaScript for graph navigation and source previews. The model and selected variable remain readable below.</p></noscript>
</body>
</html>
