[project]
name = "causal-coding"
version = "0.4.0"
description = "An executable causal theory for agentic coding and software delivery"
requires-python = ">=3.12"
dependencies = [
  "dowhy>=0.13",
  "networkx>=3.4",
  "numpy>=1.26",
  "pandas>=2.2",
  "pydantic>=2.10",
  "pydot>=3.0",
  "fastapi>=0.116",
  "jinja2>=3.1",
  "uvicorn>=0.35",
  "sqlmodel>=0.0.22",
  "pymysql>=1.1",
]

[project.scripts]
ccw = "causal_coding.web:main"
cce = "causal_coding.evidence_report:main"

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.9", "httpx>=0.28", "hypothesis>=6.100"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/causal_coding"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
